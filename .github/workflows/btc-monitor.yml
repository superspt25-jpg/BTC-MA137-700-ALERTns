
name: BTCUSDT MA137 MA700 Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a test iPhone notification"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btc-ma-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BTC monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST_NOTIFICATION: ${{ inputs.send_test_notification }}
        run: python monitor.py

      - name: Save alert state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update BTC alert state"
            git push
          fi
